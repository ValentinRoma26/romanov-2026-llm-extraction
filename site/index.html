<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Benchmark a language model on extracting calcium-binding data from one 1980 troponin paper, and score it against the published table."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f3f6f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b1412"
    />
    <title>Ca²⁺/TnC extraction assay</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%230ea47e' stroke-width='2'/%3E%3Ccircle cx='11' cy='11' r='3.4' fill='%230ea47e'/%3E%3Ccircle cx='21' cy='11' r='3.4' fill='%230ea47e'/%3E%3Ccircle cx='11' cy='21' r='3.4' fill='none' stroke='%230ea47e' stroke-width='1.6'/%3E%3Ccircle cx='21' cy='21' r='3.4' fill='none' stroke='%230ea47e' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Restart from the first step">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span>
            <strong>Ca²⁺/TnC extraction assay</strong>
            <small>One paper · one model · 42 values</small>
          </span>
        </a>
        <div class="header-meta">
          <span class="privacy-pill">
            <span aria-hidden="true"></span>
            Runs in your browser
          </span>
          <a
            class="text-link"
            href="https://github.com/ValentinRoma26/romanov-2026-llm-extraction/tree/main/tutorial"
          >
            Source
          </a>
        </div>
      </header>

      <nav class="progress-nav" aria-label="Progress">
        <div class="phase-row" id="phase-row" aria-hidden="true"></div>
        <ol id="progress-list"></ol>
      </nav>

      <main id="stage" class="stage-frame" aria-live="polite"></main>

      <footer class="stage-footer">
        <button id="back-button" class="button button-secondary" type="button">
          <span aria-hidden="true">←</span>
          Back
        </button>
        <p id="footer-hint" class="footer-hint"></p>
        <button id="next-button" class="button button-primary" type="button">
          Next
          <span aria-hidden="true">→</span>
        </button>
      </footer>
    </div>

    <dialog id="preview-dialog" class="preview-dialog">
      <div class="dialog-shell">
        <header class="dialog-header">
          <div>
            <span id="dialog-kicker" class="eyebrow">Research material</span>
            <h2 id="dialog-title">Prompt</h2>
          </div>
          <button
            id="close-dialog"
            class="icon-button"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </header>
        <div class="dialog-actions">
          <p id="dialog-note">Shown exactly as stored in the repository.</p>
          <button
            id="dialog-copy"
            class="button button-primary button-compact"
            type="button"
          >
            Copy
          </button>
        </div>
        <pre id="dialog-content" tabindex="0"></pre>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">
        This walkthrough needs JavaScript. The prompts and the paper are also in
        the
        <a
          href="https://github.com/ValentinRoma26/romanov-2026-llm-extraction/tree/main/tutorial"
          >tutorial folder on GitHub</a
        >, and work without it.
      </div>
    </noscript>
  </body>
</html>
