<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A guided, no-code tutorial for benchmarking LLM extraction from a scientific paper."
    />
    <meta name="theme-color" content="#f3f0e8" />
    <title>LLM Extraction Tutorial</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Restart from the tutorial home">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span>
            <strong>LLM Extraction Tutorial</strong>
            <small>One paper · one guided run</small>
          </span>
        </a>
        <div class="header-meta">
          <span class="privacy-pill">
            <span aria-hidden="true">●</span>
            Runs locally in your browser
          </span>
          <a
            class="text-link"
            href="https://github.com/ValentinRoma26/romanov-2026-llm-extraction/tree/main/tutorial"
          >
            View source
          </a>
        </div>
      </header>

      <nav class="progress-nav" aria-label="Tutorial progress">
        <ol id="progress-list"></ol>
      </nav>

      <main id="stage" class="stage-frame" aria-live="polite"></main>

      <footer class="stage-footer">
        <button id="back-button" class="button button-secondary" type="button">
          <span aria-hidden="true">←</span>
          Back
        </button>
        <p id="footer-hint" class="footer-hint"></p>
        <button id="next-button" class="button button-primary" type="button">
          Next
          <span aria-hidden="true">→</span>
        </button>
      </footer>
    </div>

    <dialog id="preview-dialog" class="preview-dialog">
      <div class="dialog-shell">
        <header class="dialog-header">
          <div>
            <span id="dialog-kicker" class="eyebrow">Source prompt</span>
            <h2 id="dialog-title">Prompt preview</h2>
          </div>
          <button
            id="close-dialog"
            class="icon-button"
            type="button"
            aria-label="Close prompt preview"
          >
            ×
          </button>
        </header>
        <div class="dialog-actions">
          <p id="dialog-note">Displayed verbatim from the repository.</p>
          <button
            id="dialog-copy"
            class="button button-primary button-compact"
            type="button"
          >
            Copy
          </button>
        </div>
        <pre id="dialog-content" tabindex="0"></pre>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">
        This tutorial needs JavaScript for its guided steps and copy buttons.
        The original materials remain available in the
        <a href="https://github.com/ValentinRoma26/romanov-2026-llm-extraction/tree/main/tutorial">
          GitHub tutorial folder</a
        >.
      </div>
    </noscript>
  </body>
</html>
